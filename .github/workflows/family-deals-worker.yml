name: Family Deals batch worker

on:
  workflow_dispatch:
  schedule:
    - cron: "7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read

concurrency:
  group: family-deals-worker
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: movie-gm-deploy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install pinned dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run bounded Family Deals batch
        env:
          UW_API_BASE: ${{ secrets.UW_API_BASE }}
          UW_WORKER_SECRET: ${{ secrets.UW_WORKER_SECRET }}
        run: python cloud/run_family_deals_batch.py
