name: Family Deals batch worker

on:
  workflow_dispatch:

permissions:
  contents: read

# Family Deals is on-demand only. One user search claims one job and runs once.
# The API dispatches this workflow when a user starts a Family Deals search.

concurrency:
  group: family-deals-worker-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  batch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run Family Deals batch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Restore Family Deals caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.hunt_cache
          key: family-deals-v5-${{ runner.os }}-${{ hashFiles('requirements.txt', 'modules/family-deals/server.py') }}
          restore-keys: |
            family-deals-v5-${{ runner.os }}-

      - name: Install pinned dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run bounded Family Deals batch
        env:
          UW_API_BASE: ${{ secrets.UW_API_BASE }}
          UW_WORKER_SECRET: ${{ secrets.UW_WORKER_SECRET }}
        run: python cloud/run_family_deals_batch.py
