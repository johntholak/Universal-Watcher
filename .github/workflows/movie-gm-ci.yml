name: Movie GM CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  movie-gm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Prepare Movie GM package imports
        run: |
          rm -rf cloud/free_movie_search
          cp -R modules/free-movie-search cloud/free_movie_search
          touch cloud/free_movie_search/__init__.py
      - name: Provide test-only Workers fetch shim
        run: |
          cat > workers.py <<'PY'
          async def fetch(*args, **kwargs):
              raise RuntimeError("Cloudflare Workers fetch is unavailable in offline CI tests")
          PY
      - name: Compile Movie GM Worker and engine
        run: |
          python -m py_compile cloud/movie_gm_worker.py
          python -m py_compile modules/free-movie-search/movie_gm_runtime.py
          python -m py_compile modules/free-movie-search/movie_gm_decision.py
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run Movie GM tests
        run: |
          python -m pytest modules/free-movie-search/test_*.py web/test_movie_gm_household.py -q
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate Worker JavaScript
        run: node --check cloud/worker.mjs
