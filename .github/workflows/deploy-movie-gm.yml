name: Deploy Movie GM production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# Production deploy trigger for the synced Family Deals worker.
# Temporary pin for the verified Family Deals search-recovery deployment.

concurrency:
  group: movie-gm-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Deploy Family Deals production')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UW_D1_DATABASE_NAME: ${{ secrets.UW_D1_DATABASE_NAME }}
      UW_D1_DATABASE_ID: ${{ secrets.UW_D1_DATABASE_ID }}
      TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      ACCESS_SECRET: ${{ secrets.UW_ACCESS_SECRET }}
      SESSION_KEY: ${{ secrets.UW_SESSION_KEY }}
      WORKER_SECRET: ${{ secrets.UW_WORKER_SECRET }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ea737b6c1eca6aee4533eb9fa6fcc8f01641eeee

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN UW_D1_DATABASE_NAME UW_D1_DATABASE_ID TMDB_READ_ACCESS_TOKEN OMDB_API_KEY ACCESS_SECRET SESSION_KEY WORKER_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          if [ "${#ACCESS_SECRET}" -lt 32 ] || [ "${#SESSION_KEY}" -lt 32 ] || [ "${#WORKER_SECRET}" -lt 32 ]; then
            echo "::error::UW_ACCESS_SECRET, UW_SESSION_KEY, and UW_WORKER_SECRET must each be at least 32 characters."
            exit 1
          fi

      - name: Generate production Wrangler configs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          database_name = os.environ["UW_D1_DATABASE_NAME"]
          database_id = os.environ["UW_D1_DATABASE_ID"]

          js_template = Path("cloud/wrangler.example.toml").read_text()
          js_config = (
              js_template
              .replace('database_name = "universal-watcher"', f'database_name = "{database_name}"')
              .replace('database_id = "REPLACE_WITH_D1_DATABASE_ID"', f'database_id = "{database_id}"')
          )
          Path("cloud/wrangler.toml").write_text(js_config)

          py_template = Path("cloud/movie-gm-wrangler.example.toml").read_text()
          py_config = (
              py_template
              .replace('main = "movie_gm_worker.py"', 'main = "cloud/movie_gm_worker.py"')
              .replace('database_name = "universal-watcher"', f'database_name = "{database_name}"')
              .replace('database_id = "REPLACE_WITH_D1_DATABASE_ID"', f'database_id = "{database_id}"')
          )
          Path("movie-gm-wrangler.toml").write_text(py_config)
          PY

      - name: Apply remote D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply "${UW_D1_DATABASE_NAME}" --remote --config cloud/wrangler.toml

      - name: Prepare Movie GM Python package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloud/free_movie_search
          cp -R modules/free-movie-search cloud/free_movie_search
          touch cloud/free_movie_search/__init__.py

      - name: Deploy Movie GM Python Worker
        run: npx --yes wrangler@4 deploy --config movie-gm-wrangler.toml

      - name: Set Movie GM Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TMDB_READ_ACCESS_TOKEN" | npx --yes wrangler@4 secret put TMDB_READ_ACCESS_TOKEN --name universal-watcher-movie-gm
          printf '%s' "$OMDB_API_KEY" | npx --yes wrangler@4 secret put OMDB_API_KEY --name universal-watcher-movie-gm

      - name: Deploy Universal Watcher API Worker
        run: npx --yes wrangler@4 deploy --config cloud/wrangler.toml

      - name: Set Universal Watcher API secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ACCESS_SECRET" | npx --yes wrangler@4 secret put ACCESS_SECRET --name universal-watcher-api
          printf '%s' "$SESSION_KEY" | npx --yes wrangler@4 secret put SESSION_KEY --name universal-watcher-api
          printf '%s' "$WORKER_SECRET" | npx --yes wrangler@4 secret put WORKER_SECRET --name universal-watcher-api

      - name: Production Movie GM smoke test
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://universal-watcher-api.johntholak.workers.dev"
          COOKIE_JAR="$(mktemp)"
          trap 'rm -f "$COOKIE_JAR" /tmp/movie-gm-csrf' EXIT
          SESSION_JSON="$(curl -fsS --retry 3 --retry-delay 1 -c "$COOKIE_JAR" -H "Origin: $BASE_URL" -H "Content-Type: application/json" -X POST "$BASE_URL/api/v1/session" --data "$(python -c 'import json,os; print(json.dumps({"access_secret":os.environ["ACCESS_SECRET"]}))')")"
          python - "$SESSION_JSON" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          assert data.get("authenticated") is True, data
          assert data.get("csrf_token"), data
          print("Session authentication: OK")
          open("/tmp/movie-gm-csrf","w").write(data["csrf_token"])
          PY
          CSRF="$(cat /tmp/movie-gm-csrf)"
          RESULT="$(curl -fsS --retry 2 --retry-delay 1 -b "$COOKIE_JAR" -H "Origin: $BASE_URL" -H "X-CSRF-Token: $CSRF" "$BASE_URL/api/v1/movies/search?mode=kids&query=kids%20movie")"
          python - "$RESULT" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          if "error" in data:
              raise SystemExit(f"Movie GM smoke test failed: {data}")
          assert "recommendations" in data, data
          assert "providers_checked" in data, data
          print(f"Movie GM production search: OK ({len(data['recommendations'])} recommendations, {data.get('total_candidates', 0)} candidates)")
          print("Providers checked:", ", ".join(data.get("providers_checked", [])) or "none")
          PY

      - name: Deployment summary
        run: |
          echo "Source branch: movie-gm-deploy"
          echo "Movie GM Python Worker: universal-watcher-movie-gm"
          echo "API Worker: universal-watcher-api"
          echo "D1 migrations: applied remotely"
          echo "Service binding: MOVIE_GM -> universal-watcher-movie-gm"
