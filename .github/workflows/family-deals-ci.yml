name: Family Deals CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  family-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Python test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run Family Deals and web tests
        run: |
          python -m unittest web/test_web_shell.py -v
          cd modules/family-deals
          python -m unittest discover -s tests -p "test_*.py" -v
          cd ../..
          python -m unittest cloud/test_family_deals_v5.py cloud/test_run_family_deals_batch.py -v
          node --test cloud/test_dispatch.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate Family Deals Worker JavaScript
        run: |
          node --check cloud/worker.mjs
          node --check cloud/criteria.mjs
          node --check cloud/results.mjs
          node --check cloud/dispatch.mjs
